[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-plumber"
dynamic = ["version"]
description = "A geospatial pipeline framework: phase functions run by a swappable execution strategy."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Austin Breunig" }]
keywords = ["gis", "geospatial", "pipeline", "geopandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=0.13",
    "pyarrow>=10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
plumber = "plumber.cli:main"

[project.urls]
Homepage = "https://github.com/austinbreunig/plumber"
Repository = "https://github.com/austinbreunig/plumber"
Issues = "https://github.com/austinbreunig/plumber/issues"

[tool.hatch.version]
path = "src/plumber/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plumber"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
