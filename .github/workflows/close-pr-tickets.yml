name: close-pr-tickets

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close tickets labeled pr-<number>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for n in $(gh issue list --label "pr-$PR" --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Closed by PR #$PR."
          done
